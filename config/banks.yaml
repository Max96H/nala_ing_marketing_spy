# ==========================================================
# BANK CONFIGURATION
# ==========================================================
#
# This file is the single source of truth for bank-specific
# configuration.
#
# The crawler should not contain hard-coded bank names,
# URLs or keywords.
#
# To add a new bank:
#   1. Add a new section below.
#   2. Add its URLs to "seeds".
#   3. No Python crawler file is required.
#
# ==========================================================

banks:

  # ==========================================================
  # ING
  # ==========================================================

  ing:
    name: "ING Belgium"
    domain: "ing.be"

    # URLs that should be crawled directly.
    # These are the starting points for the crawler.
    seeds:
      - "https://www.ing.be/en/individuals/campaign/current-account-free-youth"

    # Sitemap URLs can later be used to discover additional
    # relevant pages automatically.
    sitemap_urls:
      - "https://www.ing.be/sitemap-cms.xml"

    # Languages available on the bank website.
    languages:
      - en
      - fr
      - nl

    # Keywords that can be used during the discovery phase
    # to identify pages related to youth/current accounts.
    #
    # These are NOT used by the basic crawler yet.
    product_keywords:
      - youth
      - young
      - child
      - children
      - kid
      - kids
      - junior
      - minor
      - account
      - current-account
      - debit-card

    # Keywords used during the discovery phase to exclude
    # pages that are outside the research scope.
    exclude_keywords:
      - savings
      - investment
      - mortgage
      - insurance


  # ==========================================================
  # KBC
  # ==========================================================

  kbc:
    name: "KBC Belgium"
    domain: "kbc.be"

    # Direct URLs to crawl.
    seeds:
      - "https://www.kbc.be/retail/en/products/payments/current-accounts/young-person-s-account.html?zone=topnav"

    # Sitemap URLs for future page discovery.
    sitemap_urls:
      - "https://www.kbc.com/nl.sitemap.xml"
      - "https://www.kbc.com/fr.sitemap.xml"
      - "https://www.kbc.com/en.sitemap.xml"

    # Supported website languages.
    languages:
      - en
      - fr
      - nl

    # Keywords for identifying relevant youth/current-account pages.
    product_keywords:
      - youth
      - young
      - child
      - children
      - kid
      - kids
      - junior
      - minor
      - account
      - current-account
      - debit-card
      - payment
      - payments

    # Keywords for excluding unrelated financial products.
    exclude_keywords:
      - savings
      - investment
      - mortgage
      - insurance
      - loan


